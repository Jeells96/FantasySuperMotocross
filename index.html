<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FSX Fantasy League 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --bg:#0a0a0c;--bg2:#111116;--bg3:#1a1a22;--panel:#16161f;
      --border:#2a2a38;--accent:#ff5500;--accent2:#ffaa00;
      --text:#e8e8f0;--muted:#6b6b80;--green:#00e676;--gold:#ffd600;--red:#ff1744;
    }
    html,body,#root{height:100%;background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;}
    body{overflow-x:hidden;-webkit-tap-highlight-color:transparent;}
    body::before{content:'';position:fixed;inset:0;opacity:.025;pointer-events:none;z-index:9999;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
    .app{display:flex;flex-direction:column;min-height:100vh;}
    /* HEADER */
    .header{background:var(--bg2);border-bottom:2px solid var(--accent);padding:0 16px;position:sticky;top:0;z-index:100;box-shadow:0 4px 30px rgba(255,85,0,.25);}
    .header-inner{display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto;height:58px;}
    .logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.45rem;letter-spacing:.05em;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;}
    .logo span{-webkit-text-fill-color:var(--muted);font-weight:400;font-size:.9rem;margin-left:6px;}
    .nav{display:flex;gap:2px;}
    .nav-btn{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:.92rem;font-weight:700;letter-spacing:.06em;padding:8px 10px;cursor:pointer;transition:all .2s;text-transform:uppercase;}
    .nav-btn:hover{color:var(--text);}
    .nav-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
    /* MAIN */
    .main{flex:1;max-width:1200px;margin:0 auto;width:100%;padding:22px 16px 40px;}
    /* TYPOGRAPHY */
    .page-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:2.3rem;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px;line-height:1;}
    .page-title .accent{color:var(--accent);}
    .page-sub{color:var(--muted);font-size:.98rem;margin-bottom:22px;}
    .section-header{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);}
    /* CARDS */
    .card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:18px;margin-bottom:16px;}
    /* STANDINGS */
    .standings-grid{display:flex;flex-direction:column;gap:8px;}
    .standing-row{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px 14px;cursor:pointer;transition:all .2s;}
    .standing-row:hover{border-color:var(--accent);}
    .standing-row.gold-row{border-color:var(--gold);background:linear-gradient(90deg,rgba(255,214,0,.07),var(--panel));}
    .standing-row.silver-row{border-color:#aaa;}
    .standing-row.bronze-row{border-color:#cd7f32;}
    .rank{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.8rem;text-align:center;line-height:1;}
    .team-info{display:flex;flex-direction:column;min-width:0;}
    .team-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.15rem;letter-spacing:.04em;}
    .team-riders-sub{color:var(--muted);font-size:.8rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .team-pts{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.75rem;color:var(--accent);line-height:1;}
    .pts-unit{font-size:.8rem;color:var(--muted);font-weight:400;}
    /* ROUND TABLE */
    .rounds-table{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:10px;}
    .rounds-table th{text-align:left;padding:7px 10px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--border);}
    .rounds-table td{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.04);}
    .pts-cell{font-weight:700;color:var(--accent2);}
    /* SCHEDULE PILLS */
    .round-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
    .round-pill{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:4px 11px;font-size:.76rem;font-weight:600;white-space:nowrap;}
    .round-pill.done{border-color:var(--green);color:var(--green);}
    .round-pill.current{border-color:var(--accent);color:var(--accent);background:rgba(255,85,0,.1);}
    /* DRAFT */
    .filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
    .filter-btn{background:var(--panel);border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:20px;cursor:pointer;font-size:.82rem;font-weight:600;transition:all .2s;}
    .filter-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(255,85,0,.1);}
    .riders-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px;margin-bottom:28px;}
    .rider-card-btn{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:13px;cursor:pointer;text-align:left;transition:all .2s;width:100%;font-family:inherit;color:inherit;}
    .rider-card-btn:hover{border-color:var(--accent);}
    .rider-card-btn:active{transform:scale(.98);}
    .rider-card-btn.r-protected{border-color:var(--gold);background:rgba(255,214,0,.04);}
    .rider-card-btn.r-once{border-color:var(--accent2);background:rgba(255,170,0,.04);}
    .rider-card-btn.r-locked{opacity:.45;}
    .rider-num{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.65rem;color:var(--accent);line-height:1;}
    .rider-name-card{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1rem;letter-spacing:.02em;margin:4px 0 2px;}
    .rider-team-card{color:var(--muted);font-size:.73rem;line-height:1.3;}
    .status-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.66rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-top:8px;}
    .b-available{background:rgba(0,230,118,.12);color:var(--green);border:1px solid rgba(0,230,118,.4);}
    .b-protected{background:rgba(255,214,0,.12);color:var(--gold);border:1px solid rgba(255,214,0,.4);}
    .b-once{background:rgba(255,170,0,.12);color:var(--accent2);border:1px solid rgba(255,170,0,.4);}
    .b-locked{background:rgba(255,23,68,.1);color:var(--red);border:1px solid rgba(255,23,68,.3);}
    /* ROSTERS */
    .rosters-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;}
    .roster-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:13px 15px;}
    .roster-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.05rem;margin-bottom:10px;color:var(--text);}
    .roster-rider{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
    .roster-num{color:var(--accent);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.95rem;min-width:32px;}
    .roster-rname{font-size:.88rem;font-weight:600;flex:1;}
    /* MODAL */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;}
    .modal{background:var(--bg2);border:1px solid var(--border);border-radius:12px;width:100%;max-width:480px;box-shadow:0 20px 60px rgba(0,0,0,.8);animation:modalIn .2s ease;max-height:90vh;display:flex;flex-direction:column;}
    @keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
    .modal-header{padding:18px 22px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;}
    .modal-body{padding:18px 22px;overflow-y:auto;}
    .modal-close{background:none;border:none;color:var(--muted);font-size:1.4rem;cursor:pointer;padding:0 4px;margin-top:-4px;font-family:inherit;}
    .modal-close:hover{color:var(--text);}
    .modal-num{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:2.6rem;color:var(--accent);line-height:1;}
    .modal-rname{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.45rem;letter-spacing:.02em;}
    .modal-team-sub{color:var(--muted);margin-bottom:14px;font-size:.9rem;}
    .modal-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:.9rem;}
    .modal-label{color:var(--muted);}
    .modal-val{font-weight:700;}
    /* ASSIGN */
    .assign-section{margin-top:14px;}
    .assign-round-label{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;margin-top:12px;}
    .assign-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
    .assign-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:6px;cursor:pointer;font-family:'Rajdhani',sans-serif;font-size:.86rem;font-weight:600;transition:all .2s;text-align:left;}
    .assign-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
    .assign-btn:disabled{opacity:.35;cursor:not-allowed;}
    .assign-btn.is-assigned{border-color:var(--green);color:var(--green);background:rgba(0,230,118,.07);}
    .remove-btn{background:rgba(255,23,68,.1);border:1px solid rgba(255,23,68,.4);color:var(--red);padding:8px 12px;border-radius:6px;cursor:pointer;font-size:.85rem;font-weight:700;margin-top:8px;width:100%;transition:all .2s;font-family:inherit;}
    .remove-btn:hover{background:rgba(255,23,68,.2);}
    /* FORM */
    .input-label{display:block;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;}
    .text-input{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:6px;font-family:'Rajdhani',sans-serif;font-size:1rem;outline:none;transition:border .2s;}
    .text-input:focus{border-color:var(--accent);}
    .btn{padding:10px 18px;border-radius:6px;border:none;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.98rem;letter-spacing:.08em;text-transform:uppercase;transition:all .2s;display:inline-block;}
    .btn:disabled{opacity:.5;cursor:not-allowed;}
    .btn-primary{background:var(--accent);color:#fff;}
    .btn-primary:hover:not(:disabled){background:#ff7733;}
    .btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border);}
    .btn-secondary:hover{border-color:var(--accent);color:var(--accent);}
    .btn-success{background:var(--green);color:#000;}
    .btn-success:hover{background:#33ff99;}
    .btn-danger{background:var(--red);color:#fff;}
    .btn-danger:hover{background:#ff4444;}
    .btn-gold{background:var(--gold);color:#000;}
    .btn-gold:hover{background:#ffe033;}
    .btn-link{background:none;border:1px solid var(--border);color:var(--accent2);}
    .btn-link:hover{border-color:var(--accent2);}
    .btn-sm{padding:6px 12px;font-size:.82rem;}
    .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}
    .wildcard-box{background:linear-gradient(135deg,rgba(255,170,0,.08),rgba(255,85,0,.08));border:1px solid var(--accent2);border-radius:8px;padding:14px;margin:14px 0;}
    .wc-pos{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:2.8rem;color:var(--gold);line-height:1;}
    .wc-label{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px;}
    .results-list{max-height:300px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;}
    .result-item{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.04);font-size:.86rem;}
    .result-item:last-child{border-bottom:none;}
    .result-pos{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.05rem;color:var(--accent);}
    .hs-tag{background:var(--accent);color:#fff;font-size:.6rem;font-weight:700;padding:2px 5px;border-radius:3px;letter-spacing:.05em;}
    .wc-tag{background:var(--gold);color:#000;font-size:.6rem;font-weight:700;padding:2px 5px;border-radius:3px;letter-spacing:.05em;}
    .round-chip{padding:4px 10px;border-radius:20px;border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:.76rem;font-weight:600;transition:all .15s;}
    .round-chip.done{border-color:var(--green);color:var(--green);}
    .round-chip.active{border-color:var(--accent);color:var(--accent);background:rgba(255,85,0,.1);}
    /* SETTINGS */
    .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
    .setting-item{display:flex;align-items:center;gap:10px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:10px 14px;}
    .setting-num{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.15rem;color:var(--accent);min-width:22px;}
    .setting-input{flex:1;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);font-family:'Rajdhani',sans-serif;font-size:1rem;font-weight:600;padding:3px 0;outline:none;min-width:0;}
    .setting-input:focus{border-bottom-color:var(--accent);}
    .danger-zone{border:1px solid rgba(255,23,68,.4);border-radius:8px;padding:18px;margin-top:18px;background:rgba(255,23,68,.04);}
    .danger-title{color:var(--red);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.02rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;}
    /* TOAST */
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--accent);border-radius:8px;padding:12px 18px;font-weight:600;z-index:500;animation:toastIn .3s ease;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:340px;text-align:center;font-size:.92rem;}
    @keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
    /* LOADING */
    .loading{display:flex;align-items:center;gap:10px;color:var(--muted);padding:12px 0;}
    .spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0;}
    @keyframes spin{to{transform:rotate(360deg)}}
    /* EMPTY */
    .empty{text-align:center;padding:44px 22px;color:var(--muted);}
    .empty-icon{font-size:2.4rem;margin-bottom:10px;}
    a{color:var(--accent2);}
    /* RESPONSIVE */
    @media(max-width:640px){
      .settings-grid{grid-template-columns:1fr;}
      .assign-grid{grid-template-columns:1fr;}
      .riders-grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px;}
      .nav-btn{padding:8px 6px;font-size:.78rem;letter-spacing:.04em;}
      .logo{font-size:1.3rem;}
      .logo span{display:none;}
      .rosters-grid{grid-template-columns:1fr 1fr;}
      .page-title{font-size:2rem;}
      .team-pts{font-size:1.5rem;}
      .rank{font-size:1.55rem;}
      .header{padding:0 12px;}
      .main{padding:18px 12px 40px;}
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── DATA ───────────────────────────────────────────────────────────────────────
const TEAMS_DEFAULT = [“Jaren”,“Savannah”,“Jaycee”,“Maisy”,“Grandpa”,“Grandma”,“Parker”,“Josie”,“Kennedy”,“John”];

const RIDERS = [
{id:1,  name:“Hunter Lawrence”,    factory:“Honda HRC Progressive”,            number:96 },
{id:2,  name:“Cooper Webb”,        factory:“Monster Energy Yamaha Star Racing”, number:1  },
{id:3,  name:“Ken Roczen”,         factory:“Twisted Tea Suzuki”,                number:94 },
{id:4,  name:“Chase Sexton”,       factory:“Monster Energy Kawasaki”,           number:4  },
{id:5,  name:“Eli Tomac”,          factory:“Red Bull KTM Factory Racing”,       number:3  },
{id:6,  name:“Jorge Prado”,        factory:“Red Bull KTM Factory Racing”,       number:26 },
{id:7,  name:“Justin Hill”,        factory:“Team Tedder Racing KTM”,            number:46 },
{id:8,  name:“Dylan Ferrandis”,    factory:“Troy Lee Designs Red Bull Ducati”,  number:14 },
{id:9,  name:“Justin Cooper”,      factory:“Monster Energy Yamaha Star Racing”, number:32 },
{id:10, name:“Aaron Plessinger”,   factory:“Red Bull KTM Factory Racing”,       number:7  },
{id:11, name:“Garrett Marchbanks”, factory:“Monster Energy Kawasaki”,           number:36 },
{id:12, name:“Colt Nichols”,       factory:“Twisted Tea Suzuki”,                number:45 },
{id:13, name:“Shane McElrath”,     factory:“Quadlock Honda Racing”,             number:12 },
{id:14, name:“Dean Wilson”,        factory:“Quadlock Honda Racing”,             number:15 },
{id:15, name:“Christian Craig”,    factory:“Quadlock Honda Racing”,             number:28 },
{id:16, name:“Joey Savatgy”,       factory:“Quadlock Honda Racing”,             number:17 },
{id:17, name:“Malcolm Stewart”,    factory:“Rockstar Energy Husqvarna”,         number:27 },
{id:18, name:“Jason Anderson”,     factory:“Twisted Tea Suzuki”,                number:21 },
{id:19, name:“RJ Hampshire”,       factory:“Rockstar Energy Husqvarna”,         number:24 },
{id:20, name:“Justin Barcia”,      factory:“Troy Lee Designs Red Bull Ducati”,  number:51 },
{id:21, name:“Jordon Smith”,       factory:“Triumph Factory Racing”,            number:20 },
{id:22, name:“Austin Forkner”,     factory:“Triumph Factory Racing”,            number:33 },
{id:23, name:“Tristan Lane”,       factory:“Privateer Yamaha”,                  number:711},
{id:24, name:“Freddie Noren”,      factory:“Privateer Yamaha”,                  number:63 },
{id:25, name:“Kevin Moranz”,       factory:“Champion Tool Storage KMR KTM”,     number:78 },
{id:26, name:“Vince Friese”,       factory:“Privateer Kawasaki”,                number:719},
{id:27, name:“Mitchell Harrison”,  factory:“Partzilla Blaster PRMX Kawasaki”,   number:41 },
];

const POS_PTS = {1:15,2:14,3:13,4:12,5:11,6:10,7:9,8:8,9:7,10:6,11:5,12:4,13:3,14:2,
15:1,16:1,17:1,18:1,19:1,20:1,21:1,22:1};

// 17 generic rounds — venue/date populated from parsed PDF per round, so this
// stays year-agnostic. Just change TOTAL_ROUNDS if a future season has more/fewer.
const TOTAL_ROUNDS = 17;
const ROUNDS = Array.from({length: TOTAL_ROUNDS}, (_, i) => ({rnd: i + 1}));

// ── STORAGE ────────────────────────────────────────────────────────────────────
const LS_KEY = “fsx-league-v1”;
function saveData(teams, results, apiKey) {
try { localStorage.setItem(LS_KEY, JSON.stringify({teams, results, apiKey})); } catch(e){}
}
function loadData() {
try { const d = localStorage.getItem(LS_KEY); return d ? JSON.parse(d) : null; } catch(e){ return null; }
}

// ── SCORING ────────────────────────────────────────────────────────────────────
function calcTeamPts(roster, rr) {
if (!rr || !rr.results) return 0;
let total = 0;
roster.forEach(rid => {
const r = rr.results.find(x => x.riderId === rid);
if (!r) return;
let pts = POS_PTS[r.position] || 0;
if (r.holeshot) pts += 5;
if (rr.wildcardPos && r.position === rr.wildcardPos) pts += 15;
total += pts;
});
return total;
}

// ── RIDER STATUS ───────────────────────────────────────────────────────────────
function getRiderStatus(riderId, teams) {
const pickedBy = teams.filter(t => t.roster && t.roster.includes(riderId));
const isR1 = teams.some(t => t.r1 === riderId);
if (pickedBy.length === 0) return { status:“available”, pickedBy:[] };
if (isR1) return { status:“protected”, pickedBy };
if (pickedBy.length >= 2) return { status:“locked”, pickedBy };
return { status:“once”, pickedBy };
}

// ── PDF PARSE via Anthropic API ────────────────────────────────────────────────
async function parsePdf(url, apiKey) {
const systemPrompt = “You parse AMA Supercross race result PDFs. Extract the 450SX main event finishing order and return ONLY a valid JSON object with this exact structure (no markdown, no code fences, no explanation):\n” +
‘{“venue”:“Nashville”,“date”:“Apr 11, 2026”,“results”:[{“position”:1,“name”:“Hunter Lawrence”,“holeshot”:false},{“position”:10,“name”:“Shane McElrath”,“holeshot”:true}]}\n’ +
“Rules:\n” +
“- The holeshot winner has (HS) next to their name in the PDF\n” +
“- Include ALL finishers (positions 1 through 22)\n” +
“- Use full rider names (First Last)\n” +
“- Return ONLY the raw JSON object. Do not wrap in markdown code fences.”;

const res = await fetch(“https://api.anthropic.com/v1/messages”, {
method: “POST”,
headers: {
“Content-Type”: “application/json”,
“x-api-key”: apiKey,
“anthropic-version”: “2023-06-01”,
“anthropic-dangerous-direct-browser-access”: “true”
},
body: JSON.stringify({
model: “claude-sonnet-4-20250514”,
max_tokens: 2500,
system: systemPrompt,
messages: [{
role: “user”,
content: [
{ type: “document”, source: { type: “url”, url: url } },
{ type: “text”, text: “Parse this AMA Supercross PDF and extract the 450SX main event results as JSON per the system instructions.” }
]
}]
})
});

if (!res.ok) {
let msg = “API error “ + res.status;
try { const e = await res.json(); msg = e.error?.message || msg; } catch(_){}
throw new Error(msg);
}
const data = await res.json();
let text = (data.content || []).map(c => c.text || “”).join(””).trim();
// Strip code fences if present
text = text.replace(/^`(?:json)?\s*/i, "").replace(/\s*`\s*$/, “”).trim();
// Extract JSON object if there’s surrounding text
const first = text.indexOf(”{”);
const last = text.lastIndexOf(”}”);
if (first !== -1 && last !== -1) text = text.slice(first, last + 1);
return JSON.parse(text);
}

const url = (urlsByRound[rnd]||””).trim();

setParsingRound(rnd);
setParsedFor(rnd, null);
try {
const raw = await parsePdf(url, apiKey);
const matched = (raw.results||[]).map(r => {
const parts = r.name.trim().split(/\s+/);
const last = parts[parts.length-1].toLowerCase();
const first = parts[0].toLowerCase();

if (!db) {
db = RIDERS.find(rd => {
const rdParts = rd.name.split(/\s+/);
const rdLast = rdParts[rdParts.length-1].toLowerCase();
const rdFirst = rdParts[0].toLowerCase();
return rdLast===last && rdFirst===first;
});
}
if (!db) {
db = RIDERS.find(rd => rd.name.split(/\s+/).pop().toLowerCase() === last);
}
return {…r, riderId: db?.id||null, displayName: db?.name||r.name};
});
setParsedFor(rnd, {…raw, results: matched});
showToast(“✅ Parsed! “ + raw.venue + “ — “ + matched.length + “ finishers”);

showToast(“❌ Parse failed: “ + e.message);
}
setParsingRound(null);
};

const handleSave = (rnd) => {

const wcRaw = wildcardByRound[rnd];

const newResults = {

updateResults(newResults);
showToast(“✅ Round “ + rnd + “ saved!”);

setParsedFor(rnd, null);

                )}
              </div>
            )}
          </div>

      </div>

</div>

function SettingsPage({teams, updateTeams, results, updateResults, showToast}) {
